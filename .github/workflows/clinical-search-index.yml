name: Refresh clinical search content
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run index:apps
      - name: Commit refreshed public content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/clinical-content-index.json
          git diff --cached --quiet || git commit -m 'Refresh application search content'
          git push
